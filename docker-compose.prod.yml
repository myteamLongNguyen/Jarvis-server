# Production stack for a single Linux server:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Only Caddy is reachable from outside. Postgres and the API sit on the internal
# network, and Caddy terminates HTTPS with an automatic Let's Encrypt certificate
# for API_DOMAIN — iOS refuses plain-HTTP API calls, so this is not optional.
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - jarvis_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      # Inside the compose network the database is reached by service name, and
      # the API must listen on all interfaces for Caddy to reach it.
      DB_HOST: postgres
      DB_PORT: 5432
      HOST: 0.0.0.0
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  jarvis_postgres_data:
  caddy_data:
  caddy_config:
