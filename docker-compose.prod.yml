# Production stack for a single Linux server. Two ways to put HTTPS in front:
#
#   Server already running nginx (the usual case — it owns ports 80/443):
#     docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#   then proxy the domain to 127.0.0.1:${API_PORT} and issue the cert with certbot.
#
#   Empty server, nothing on 80/443 — let the bundled Caddy do HTTPS itself:
#     docker compose -f docker-compose.prod.yml --env-file .env.production --profile caddy up -d --build
#
# Postgres is never published. The API is published on loopback only, so it is
# reachable by the host's reverse proxy but not from the internet directly — iOS
# refuses plain-HTTP API calls, so HTTPS in front of it is not optional.
# Pinned, because Compose otherwise names the project after whatever directory
# it is run from. The live stack was first brought up as "jarvis", so a deploy
# from /opt/jarvis-server would otherwise build a second, empty stack beside it
# and leave the real one running the old image.
name: jarvis

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - jarvis_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      # Inside the compose network the database is reached by service name, and
      # the API listens on all interfaces within its container.
      DB_HOST: postgres
      DB_PORT: 5432
      HOST: 0.0.0.0
      PORT: 3001
    ports:
      - '127.0.0.1:${API_PORT:-3001}:3001'
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    profiles: ['caddy']
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  jarvis_postgres_data:
  caddy_data:
  caddy_config:
