services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: jarvis
      POSTGRES_DB: jarvis
    ports:
      - '5432:5432'
    volumes:
      - jarvis_postgres_data:/var/lib/postgresql/data

volumes:
  jarvis_postgres_data:
